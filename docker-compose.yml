# Stack PMS. Sem portas publicadas no host — adequado ao Easypanel (proxy por serviço).
# Local: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Variáveis: ficheiro .env na raiz (ver .env.example). No Easypanel: aba Environment do projeto Compose.

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pms}
      POSTGRES_DB: ${POSTGRES_DB:-pms}
    volumes:
      - pms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pms} -d ${POSTGRES_DB:-pms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - pms_redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: "3000"
      SOCKET_AUTH_TOKEN: ${SOCKET_AUTH_TOKEN:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-32chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SITE_URL: ${SITE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PRISMA_MIGRATE_ON_START: ${PRISMA_MIGRATE_ON_START:-false}
      SKIP_PRISMA_MIGRATE: ${SKIP_PRISMA_MIGRATE:-true}
      PASSWORD_RESET_DEBUG: ${PASSWORD_RESET_DEBUG:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    volumes:
      - pms_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["sh", "-c", "node dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SOCKET_AUTH_TOKEN: ${SOCKET_AUTH_TOKEN:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-32chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SITE_URL: ${SITE_URL:-}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PMS_API_URL: ${VITE_PMS_API_URL:-http://localhost:3000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost}
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  pms_postgres:
  pms_redis:
  pms_storage:
