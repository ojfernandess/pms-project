# Stack PMS — desenvolvimento local e testes integrados.
# Produção no Easypanel: serviços independentes (ver deploy/README.md e deploy/easypanel/).
#
# Local: docker compose --profile local-db -f docker-compose.yml -f docker-compose.local.yml up --build
# Variáveis: .env na raiz (ver .env.example).

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pms}
      POSTGRES_DB: ${POSTGRES_DB:-pms}
    volumes:
      - pms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pms} -d ${POSTGRES_DB:-pms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - pms_redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: "3000"
      SOCKET_AUTH_TOKEN: ${SOCKET_AUTH_TOKEN:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-32chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SITE_URL: ${SITE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PRISMA_MIGRATE_ON_START: ${PRISMA_MIGRATE_ON_START:-false}
      PASSWORD_RESET_DEBUG: ${PASSWORD_RESET_DEBUG:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_DIR: ${STORAGE_DIR:-/app/storage}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_PORT: ${MINIO_PORT:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    volumes:
      - pms_storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["sh", "-c", "node dist/worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pms:pms@postgres:5432/pms}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SOCKET_AUTH_TOKEN: ${SOCKET_AUTH_TOKEN:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-32chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SITE_URL: ${SITE_URL:-}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PMS_API_URL: ${VITE_PMS_API_URL:-http://localhost:3000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:8080}
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:3000}
    expose:
      - "80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pms_postgres:
  pms_redis:
  pms_storage:
