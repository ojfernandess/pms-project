services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms
      POSTGRES_DB: pms
    ports:
      - "5432:5432"
    volumes:
      - pms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pms_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://pms:pms@postgres:5432/pms
      REDIS_URL: redis://redis:6379
      PORT: 3000
      SOCKET_AUTH_TOKEN: ${SOCKET_AUTH_TOKEN:-dev-socket-token}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-32chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://pms:pms@postgres:5432/pms
      REDIS_URL: redis://redis:6379
      SOCKET_AUTH_TOKEN: ${SOCKET_AUTH_TOKEN:-dev-socket-token}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-32chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PMS_API_URL: ${VITE_PMS_API_URL:-http://localhost:3000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:8080}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pms_postgres:
  pms_redis:
